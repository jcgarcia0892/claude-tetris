<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1 class="title">TETRIS</h1>

  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <button id="theme-toggle" type="button" aria-pressed="false">Modo claro</button>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="gameover-records" class="records hidden">
          <form id="record-form" class="record-form hidden">
            <p id="record-rank" class="record-new"></p>
            <div class="record-input-row">
              <input id="record-name" type="text" maxlength="12" placeholder="Tu nombre" autocomplete="off" spellcheck="false" aria-label="Nombre del jugador" />
              <button id="record-save" type="submit">Guardar</button>
            </div>
          </form>
          <p id="gameover-stats" class="records-stats"></p>
          <div id="gameover-table" class="records-table"></div>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box records">
        <p class="records-title">RECORDS</p>
        <div id="start-table" class="records-table"></div>
        <p id="start-stats" class="records-stats"></p>
        <button id="play-btn" type="button">Jugar</button>
        <p class="records-hint">o pulsa <kbd>Enter</kbd></p>
        <button id="reset-records-btn" type="button">Borrar records</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
